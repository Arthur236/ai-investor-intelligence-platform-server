[project]
name = "ai-investor-intelligence-platform-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arthur", email = "" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.69.0",
    "astrapy>=1.5.0,<2",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.3",
    "langchain-experimental>=0.4.2",
    "langchain-voyageai>=0.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pymupdf4llm>=1.28.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[project.scripts]
ai-investor-intelligence-platform-server = "src:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
